[project]
name = "ivac-voice-agent"
version = "0.1.0"
description = "İşletme Vitrini AI Çağrı Merkezi — LiveKit voice agent runtime"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "livekit-agents[openai]>=1.5,<1.6",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "tenacity>=9.0,<10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["livekit.*", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
