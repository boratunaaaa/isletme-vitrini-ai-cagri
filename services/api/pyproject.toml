[project]
name = "ivac-api"
version = "0.1.0"
description = "İşletme Vitrini AI Çağrı Merkezi — FastAPI backend + Celery worker"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery>=5.4",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "phonenumbers>=8.13",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.18",
    "livekit-api>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "celery-types>=0.22",
    "types-openpyxl>=3.1",
    "freezegun>=1.5",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["phonenumbers.*", "livekit.*", "sse_starlette.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
